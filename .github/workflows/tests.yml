name: Tests
on:   # solo en main (los cambios van ahí; las ramas de trabajo duplicaban la ejecución) y si cambia Python
  push:
    branches: [main]
    paths: ['fondos/**', 'tests/**', 'pyproject.toml', '.github/workflows/tests.yml']
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install --quiet pytest requests numpy  # numpy: la fuerza bruta de analisis
      - run: python -m pytest -q
