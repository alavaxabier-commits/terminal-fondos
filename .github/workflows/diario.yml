name: Ingesta diaria
on:
  schedule:
    - cron: '17 6 * * *'   # cada día, 7:17 en Madrid (8:17 en verano)
  workflow_dispatch:
    inputs:
      orden:
        description: 'Orden de python -m fondos'
        type: choice
        options: [diario, precios, macro, metricas, estado, alta, universo, composicion, myinvestor, prueba-red]
        default: diario
      argumentos:
        description: 'Argumentos (p. ej. los ISIN para «alta» o «prueba-red», o --tanda 100)'
        required: false
        default: ''
concurrency: ingesta   # nunca dos a la vez
jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install --quiet .
      - name: Ejecutar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ORDEN: ${{ inputs.orden || 'diario' }}
          ARGUMENTOS: ${{ inputs.argumentos }}
        run: python -m fondos "$ORDEN" ${ARGUMENTOS//—/--}  # el Mac convierte -- en raya
