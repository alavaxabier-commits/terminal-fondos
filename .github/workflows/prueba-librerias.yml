# Temporal: comprueba si morningpy y morningstarFetcher listan fondos de España sin pasar por la comprobación anti-bots.
name: Prueba librerías Morningstar
on: workflow_dispatch
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet morningpy morningstarFetcher || pip install --quiet morningpy; pip install --quiet morningstarFetcher || true
      - name: Servicios que usan (URLs en su código)
        run: |
          D=$(python -c "import site; print(site.getsitepackages()[0])")
          for p in morningpy morningstarFetcher morningstarfetcher; do
            [ -d "$D/$p" ] && echo "== $p" && grep -rhoE "https?://[a-zA-Z0-9./_{}-]*morningstar[a-zA-Z0-9./_{}?=&%-]*" "$D/$p" | sort -u | head -40
            [ -d "$D/$p" ] && grep -rlE "selenium|playwright|waf|captcha" "$D/$p" | head -5
          done
          pip show morningpy morningstarFetcher 2>/dev/null | grep -E "^(Name|Version|Requires)"
      - name: Prueba
        run: |
          cat > p.py <<'PY'
          import asyncio, inspect, logging, traceback
          logging.basicConfig(level=logging.DEBUG, format='%(name)s %(message)s')
          for n in ('httpx', 'httpcore', 'aiohttp', 'hpack', 'charset_normalizer'):
              logging.getLogger(n).setLevel(logging.WARNING if n != 'httpx' else logging.INFO)

          def corto(x):
              try:
                  import pandas as pd
                  if isinstance(x, pd.DataFrame):
                      return f'DataFrame {x.shape} columnas {list(x.columns)[:15]}\n{x.head(3).to_string()[:800]}'
              except Exception:
                  pass
              return repr(x)[:800]

          def probar(nombre, f):
              print(f'\n==== {nombre}', flush=True)
              try:
                  r = f()
                  if inspect.isawaitable(r):
                      r = asyncio.run(r)
                  print('OK', corto(r), flush=True)
              except Exception as e:
                  print('FALLA', type(e).__name__, str(e)[:300])
                  traceback.print_exc(limit=3)

          try:
              import morningpy.api.ticker as t
              print('morningpy.ticker:', [x for x in dir(t) if not x.startswith('_')])
              if hasattr(t, 'get_all_funds'):
                  probar('morningpy get_all_funds', t.get_all_funds)
              if hasattr(t, 'search_tickers'):
                  probar('morningpy search_tickers fund', lambda: t.search_tickers(security_type='fund'))
              if hasattr(t, 'convert'):
                  probar('morningpy convert ISIN', lambda: t.convert(isin='IE00B03HD191', convert_to='security_id'))
          except Exception as e:
              print('morningpy no carga', e)
          try:
              import morningstarFetcher as mf
              print('morningstarFetcher:', [x for x in dir(mf) if not x.startswith('_')])
              s = mf.Screener()
              probar('morningstarFetcher Screener mutual_funds es', lambda: s.get('mutual_funds', 'es'))
          except Exception as e:
              print('morningstarFetcher no carga', type(e).__name__, e)
          PY
          python p.py 2>&1 | grep -vE "^(urllib3|asyncio) .*(Starting new|Resetting|Using selector)" | head -200
