name: Prueba X-Ray (temporal)
on:
  workflow_dispatch:
    inputs:
      fondos:
        description: 'ISIN:SecId separados por espacios'
        required: true
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install --quiet . 'mstarpy<11'
      - run: python scripts/prueba_xray.py ${{ inputs.fondos }}
