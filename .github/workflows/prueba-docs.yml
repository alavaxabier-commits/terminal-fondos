name: Prueba documentos (temporal)
on:
  workflow_dispatch:
    inputs:
      fondos: { description: 'MS_ID separados por espacios', required: true }
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install --quiet .
      - env: { FONDOS: '${{ inputs.fondos }}' }
        run: python scripts/prueba_documentos.py $FONDOS
