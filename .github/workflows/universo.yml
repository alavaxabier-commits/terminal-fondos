name: Universo semanal
on:
  schedule:
    - cron: '23 4 * * 0'   # los domingos, 5:23 en Madrid (6:23 en verano), antes de la ingesta diaria
  workflow_dispatch:
    inputs:
      top:
        description: 'Fondos por categoría'
        default: '30'
concurrency: ingesta
jobs:
  universo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install --quiet .
      - name: Fichas de Morningstar España y universo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOP: ${{ inputs.top || '30' }}
        run: python -m fondos universo --top "$TOP"
