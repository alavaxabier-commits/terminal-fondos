[project]
name = "terminal-fondos"
version = "0.1.0"
description = "Terminal personal de seguimiento y selección de fondos de inversión"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.31",
  "psycopg[binary]>=3.2",
  "mstarpy<11",       # 10.x: el mismo que funciona en el repo Finanzas (abre Chrome con Selenium)
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["fondos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
